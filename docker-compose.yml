# Base de datos local para desarrollo: docker compose up -d
# Lee POSTGRES_DB, POSTGRES_USER y POSTGRES_PASSWORD del archivo .env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-de-citas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5433 en el PC para no chocar con otro PostgreSQL instalado en Windows (p. ej. el de Odoo).
      - "5433:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-postgres:
