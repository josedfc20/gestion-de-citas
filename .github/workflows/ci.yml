# Compila y ejecuta las pruebas en cada push y en cada pull request. Con una
# etiqueta v* (v1.0.0...) publica además las imágenes de producción (paso 7a).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers usa el Docker que ya trae el runner de Ubuntu.
      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B verify

      # Cobertura con JaCoCo: resumen en la página de la ejecución e informe HTML descargable.
      - name: Resumen de la cobertura
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 { lf += $8; lc += $9; bf += $6; bc += $7 }
            END { printf "### Cobertura del backend\n\n| Líneas | Ramas |\n|---|---|\n| %.1f %% | %.1f %% |\n", 100 * lc / (lf + lc), 100 * bc / (bf + bc) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el informe de cobertura
        if: always() && hashFiles('backend/target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend (Node 24 + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      # Vitest + Testing Library + MSW: no necesitan el backend. Se miden con cobertura.
      - name: Pruebas
        run: npm run test:cobertura

      - name: Resumen de la cobertura
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: |
          node -e "const t = require('./coverage/coverage-summary.json').total;
            console.log('### Cobertura de la web\n\n| Líneas | Ramas | Funciones |\n|---|---|---|\n| ' +
              [t.lines, t.branches, t.functions].map((m) => m.pct + ' %').join(' | ') + ' |')" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el informe de cobertura
        if: always() && hashFiles('frontend/coverage/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-web
          path: frontend/coverage/
          retention-days: 14

      - name: Compilar
        run: npm run build

  # Paso 5c: la web y el backend de verdad en Chromium, contra PostgreSQL y Mailpit.
  e2e:
    name: Punta a punta (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_de_citas_e2e
          POSTGRES_USER: gestion_de_citas
          POSTGRES_PASSWORD: clave-solo-para-la-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestion_de_citas -d gestion_de_citas_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DB_URL: jdbc:postgresql://localhost:5432/gestion_de_citas_e2e
      POSTGRES_USER: gestion_de_citas
      POSTGRES_PASSWORD: clave-solo-para-la-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Compilar el backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      # Playwright compila la web y la sirve con vite preview (e2e/playwright.config.ts).
      - name: Instalar las dependencias de la web
        working-directory: frontend
        run: npm ci

      - name: Instalar Playwright y Chromium
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        working-directory: e2e
        run: npx playwright test

      # Con captura, vídeo, traza y peticiones a la API de lo que falle, y el registro
      # del backend: npx playwright show-report <carpeta>
      - name: Guardar el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/registros/
          retention-days: 14

  # Paso 7a: las imágenes de producción (docker-compose.prod.yml), solo si todas las
  # pruebas pasan. En cada PR y push a main se construyen sin publicarse, para que un
  # Dockerfile roto se vea antes de fusionar. Con una etiqueta v* se construyen para
  # Intel y ARM (el servidor gratuito de Oracle es ARM) y se publican en GitHub
  # Container Registry: ghcr.io/josedfc20/gestion-de-citas-backend y -web.
  imagenes:
    name: Imagen ${{ matrix.nombre }}
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nombre: backend
            carpeta: backend
          - nombre: web
            carpeta: frontend
    env:
      PUBLICAR: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      # Java y la web se compilan en Intel (BUILDPLATFORM en los Dockerfile); QEMU solo
      # hace falta para los pocos pasos de la imagen final de ARM.
      - name: Preparar la emulación de ARM
        if: env.PUBLICAR == 'true'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> etiquetas 1.2.3 y 1.2 (VERSION en .env.prod).
      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gestion-de-citas-${{ matrix.nombre }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=ref,event=branch

      - name: Construir (y publicar con una etiqueta v*)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.carpeta }}
          platforms: ${{ env.PUBLICAR == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
