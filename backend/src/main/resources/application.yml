# Configuración técnica. Los secretos llegan por variables de entorno o desde el
# archivo .env de la raíz del repositorio (nunca se escriben aquí).
spring:
  application:
    name: gestion-de-citas
  config:
    # Lee ../.env al arrancar desde backend/ (o .env desde la raíz) si existe.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gestion_de_citas}
    username: ${POSTGRES_USER:gestion_de_citas}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # las tablas las crea Flyway; Hibernate solo comprueba
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  # Correo (B3). En local, Mailpit de docker-compose: bandeja en http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Si el servidor de correo no responde, la API sigue sana: solo falla el envío.
    mail:
      enabled: false

app:
  # Web a la que lleva el enlace del correo de recuperación (CU-020).
  web-url: ${APP_WEB_URL:http://localhost:5173}
  correo:
    remitente: ${MAIL_FROM:no-responder@gestiondecitas.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-duracion: 15m
    refresh-token-duracion: 7d
    cookie-secure: ${COOKIE_SECURE:true}
    intentos-login-por-minuto: 5
  # Primer administrador: se crea al arrancar si el correo aún no existe (B2).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nombre: ${ADMIN_NOMBRE:Administrador}
